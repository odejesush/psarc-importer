name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows
        run: >
          dotnet publish src/PsarcImporter/PsarcImporter.csproj
          -c Release
          -r win-x64
          --self-contained
          -o publish/win-x64
          /p:NuGetAudit=false

      - name: Publish Linux
        run: >
          dotnet publish src/PsarcImporter/PsarcImporter.csproj
          -c Release
          -r linux-x64
          --self-contained
          -o publish/linux-x64
          /p:NuGetAudit=false

      - name: Publish macOS Intel
        run: >
          dotnet publish src/PsarcImporter/PsarcImporter.csproj
          -c Release
          -r osx-x64
          --self-contained
          -o publish/osx-x64
          /p:NuGetAudit=false

      - name: Publish macOS Apple Silicon
        run: >
          dotnet publish src/PsarcImporter/PsarcImporter.csproj
          -c Release
          -r osx-arm64
          --self-contained
          -o publish/osx-arm64
          /p:NuGetAudit=false

      - name: Zip Windows
        run: 7z a publish/PsarcImporter-win-x64.zip ./publish/win-x64/*

      - name: Zip Linux
        run: 7z a publish/PsarcImporter-linux-x64.zip ./publish/linux-x64/*

      - name: Zip macOS Intel
        run: 7z a publish/PsarcImporter-osx-x64.zip ./publish/osx-x64/*

      - name: Zip macOS Apple Silicon
        run: 7z a publish/PsarcImporter-osx-arm64.zip ./publish/osx-arm64/*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/PsarcImporter-win-x64.zip
            publish/PsarcImporter-linux-x64.zip
            publish/PsarcImporter-osx-x64.zip
            publish/PsarcImporter-osx-arm64.zip
